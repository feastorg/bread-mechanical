# Stand-in for Slice_DCMT slice.yaml (only the enclosure block). Board frame: x from the bus edge,
# y from the bottom edge, z above the top copper (negative = under the board). Not written to the repo.
hardware:
  enclosure:
    modifiers:
      # A1 Arduino_Nano soldered direct, pin rows at x 20.01 / 35.25 (tools/boardgeom.py).
      # Unclipped tails ~4.4 under the board (estimate) vs 3.23 floor gap -> windows through the lid.
      floor_reliefs:
        - {x: [18.5, 21.5], y: [5.3, 43.8], depth: through}
        - {x: [33.75, 36.75], y: [5.3, 43.8], depth: through}
      # The Nano mini-USB wall notch is now the S format default (formats.yaml S.mcu_access.nano).
